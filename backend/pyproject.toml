[project]
name = "deal-room-backend"
version = "0.1.0"
description = "Authoritative realtime backend for Deal Room."
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4.0",
  "flask-cors>=4.0,<7.0",
  "Flask-SocketIO>=5.3,<6.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["flask_socketio"]
ignore_missing_imports = true
